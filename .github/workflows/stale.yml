name: Stale

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: 45
          days-before-pr-close: 14
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: >
            This issue has been marked as stale because it has been open for 60 days
            with no activity. It will be closed in 14 days unless there is new activity.
          stale-pr-message: >
            This pull request has been marked as stale because it has been open for 45 days
            with no activity. It will be closed in 14 days unless there is new activity.
          exempt-issue-labels: "security,good first issue"
